<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>后台登录</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .login-card {
      width: 360px;
      margin: 100px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .error {
      display: none;
      margin-top: 14px;
      color: #b91c1c;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>后台登录</h1>
    <form action="/login" method="post">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required />

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">登录</button>
    </form>
    <div id="error" class="error">用户名或密码错误。</div>
    <a href="/">返回聊天页面</a>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).has("error")) {
      document.getElementById("error").style.display = "block";
    }
  </script>
</body>
</html>
